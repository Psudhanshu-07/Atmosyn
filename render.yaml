services:
  - type: web
    name: atomsyn-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python seed_database.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GFS_AUTO_UPDATE
        value: "0"
      - key: MODEL_PATH
        value: ../ml/models
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
