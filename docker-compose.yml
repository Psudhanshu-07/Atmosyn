version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: forecast_dev
      POSTGRES_PASSWORD: forecast_dev
      POSTGRES_DB: forecast_bust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://forecast_dev:forecast_dev@postgres:5432/forecast_bust
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./data:/app/data:ro
    command: >
      sh -c "python seed_database.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
